name: seal-build

# Upstream jackson-1 (codehaus Jackson 1.x) has no GitHub Actions CI; it builds
# with Apache Ant (build.xml + ant/build-test.xml). This workflow replays that
# build: `ant jars.asl` produces build/jackson-mapper-asl-<ver>.jar and
# `ant test` runs the project's JUnit suite (main + interop/ext + jaxrs + versions).
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated fully-qualified test class names to run instead of the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Zulu JDK 6 and Ant 1.8.4
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o jdk6.tar.gz https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
          sudo tar -xzf jdk6.tar.gz -C /opt
          curl -fsSL -o ant.tar.gz https://archive.apache.org/dist/ant/binaries/apache-ant-1.8.4-bin.tar.gz
          sudo tar -xzf ant.tar.gz -C /opt
          echo "JAVA_HOME=/opt/zulu6.22.0.3-jdk6.0.119-linux_x64" >> "$GITHUB_ENV"
          echo "ANT_HOME=/opt/apache-ant-1.8.4" >> "$GITHUB_ENV"
          echo "/opt/zulu6.22.0.3-jdk6.0.119-linux_x64/bin" >> "$GITHUB_PATH"
          echo "/opt/apache-ant-1.8.4/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          ant -version

      - name: Build jackson-mapper-asl jar
        run: ant jars.asl

      - name: Run tests
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          if [ -n "${TEST_FILTER}" ]; then
            for t in ${TEST_FILTER}; do
              echo "=== Running selected test ${t} ==="
              ant test.single -Dtest="${t}"
            done
          else
            ant test
          fi

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob("test/results/xml/TEST-*.xml"))
          tot = fail = err = 0
          for f in files:
              r = ET.parse(f).getroot()
              t, fl, e = int(r.get("tests", 0)), int(r.get("failures", 0)), int(r.get("errors", 0))
              tot += t; fail += fl; err += e
              print("SUITE %s tests=%d failures=%d errors=%d" % (r.get("name"), t, fl, e))
              name = r.get("name", "")
              if ".map.interop." in name or ".map.ext." in name:
                  for tc in r.findall("testcase"):
                      status = "FAILED" if (tc.find("failure") is not None or tc.find("error") is not None) else "PASSED"
                      print("  TEST %s.%s %s" % (tc.get("classname"), tc.get("name"), status))
          print("TOTAL classes=%d tests=%d failures=%d errors=%d passed=%d" % (len(files), tot, fail, err, tot - fail - err))
          EOF

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jackson-mapper-asl
          path: build/jackson-mapper-asl-*.jar
          if-no-files-found: error
